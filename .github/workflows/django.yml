name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  DJANGO_SETTINGS_MODULE: tests.settings

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        database: [sqlite, postgres]
        include:
          - python-version: "3.10"
            django-version: "5.2"
          - python-version: "3.11"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "6.0"
          - python-version: "3.12"
            django-version: "6.1"
          - python-version: "3.13"
            django-version: "5.2"
          - python-version: "3.13"
            django-version: "6.0"
          - python-version: "3.13"
            django-version: "6.1"
          - python-version: "3.14"
            django-version: "5.2"
          - python-version: "3.14"
            django-version: "6.0"
          - python-version: "3.14"
            django-version: "6.1"

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django-shared-property
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Verify wheel declares Django
        run: |
          python -m venv .wheel-check
          .wheel-check/bin/python -m pip install --upgrade pip
          .wheel-check/bin/python -m pip install dist/*.whl
          .wheel-check/bin/python -c "import django, django_shared_property; print(django.get_version()); print(django_shared_property.__version__)"
      - name: Install test matrix
        run: |
          python -m pip install "Django==${{ matrix.django-version }}.*" -r requirements_test.txt
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Run tests
        env:
          DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@localhost:5432/django-shared-property' || 'sqlite:memory:' }}
          PYTHONPATH: .
        run: pytest --cov=django_shared_property -s tests/tests/
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
